---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# This recipe installs the version of the CachyOS version of the kernel from the official COPR repository for it.

modules:
  - type: containerfile
    containerfiles:
      - clear-rpmostree-kernel-hooks

  - type: dnf
    repos:
      cleanup: true
      copr: 
        - bieszczaders/kernel-cachyos
    remove:
      packages:
        - kernel
        - kernel-core
        - kernel-modules
        - kernel-modules-core
        - kernel-modules-extra
    install:
      packages:
        - kernel-cachyos
        - kernel-cachyos-devel-matched
    
  - type: containerfile
    containerfiles:
      - finish-kernel-install